# Tag `v*` -> test -> Release build -> tar.gz of tools/ binaries -> SHA-256 -> GitHub Release.
# Design notes: docs/design/ci.md
name: release

on:
  push:
    tags: ["v*"]

# Default is read-only; only the `publish` job is granted contents: write.
permissions:
  contents: read

# Never cancel a release half-way (a partially uploaded release is worse than a queued one).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CTEST_OUTPUT_ON_FAILURE: "1"
  UV_PYTHON: "3.12"
  LLVM_MAJOR: "22"
  PRESET: ci-release

jobs:
  build:
    name: build / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-26.04
            platform: linux-x86_64
          - os: macos-26
            platform: macos-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate tag
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$GITHUB_REF_NAME' is not of the form vX.Y.Z[-suffix]"; exit 1
          fi

      - name: Toolchain (Ubuntu, apt clang ${{ env.LLVM_MAJOR }})
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          pkgs=()
          command -v "clang++-${LLVM_MAJOR}" >/dev/null || pkgs+=("clang-${LLVM_MAJOR}")
          command -v ninja >/dev/null || pkgs+=(ninja-build)
          if [ "${#pkgs[@]}" -gt 0 ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${pkgs[@]}"
          fi
          echo "CXX=clang++-${LLVM_MAJOR}" >> "$GITHUB_ENV"

      - name: Toolchain (macOS, Apple clang)
        if: runner.os == 'macOS'
        run: command -v ninja >/dev/null || brew install ninja

      # Restore only: release builds never write to the cache (avoids cache poisoning via tags).
      - name: Restore FetchContent cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/fetchcontent/${{ env.PRESET }}
          key: fetchcontent-${{ runner.os }}-${{ runner.arch }}-${{ env.PRESET }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: cmake --preset "$PRESET" -DFETCHCONTENT_BASE_DIR="$GITHUB_WORKSPACE/.cache/fetchcontent/$PRESET"

      - name: Build (Release, -Werror)
        run: cmake --build --preset "$PRESET"

      - name: Test (all CTest labels)
        run: ctest --preset "$PRESET" --no-tests=ignore

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: false

      - name: Test (pytest)
        run: |
          set -uo pipefail
          uv sync --locked
          dirs=()
          for d in tests/harness tests/python; do [ -d "$d" ] && dirs+=("$d"); done
          [ "${#dirs[@]}" -eq 0 ] && exit 0
          uv run pytest "${dirs[@]}"
          rc=$?
          [ "$rc" -eq 5 ] && exit 0
          exit "$rc"

      - name: Package tools/ binaries
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          srcs=(tools/*.cpp)
          if [ "${#srcs[@]}" -eq 0 ]; then
            echo "::error::tools/*.cpp is empty; nothing to release"; exit 1
          fi
          name="almost-linear-sssp-${GITHUB_REF_NAME}-${PLATFORM}"
          stage="dist/${name}"
          mkdir -p "${stage}/bin"
          for src in "${srcs[@]}"; do
            tool="$(basename "${src}" .cpp)"
            bin="build/${PRESET}/${tool}"
            [ -x "${bin}" ] || { echo "::error::missing binary ${bin}"; exit 1; }
            cp "${bin}" "${stage}/bin/"
          done
          for f in README.md LICENSE CITATION.cff; do [ -f "$f" ] && cp "$f" "${stage}/"; done
          {
            echo "version: ${GITHUB_REF_NAME}"
            echo "commit: ${GITHUB_SHA}"
            echo "platform: ${PLATFORM}"
            echo "preset: ${PRESET}"
            echo "compiler: $("${CXX:-c++}" --version | head -n1)"
          } > "${stage}/BUILD_INFO.txt"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          ( cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256" && cat "${name}.tar.gz.sha256" )

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify checksums and build SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          ls -l
          cat ./*.tar.gz.sha256 > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          cat SHA256SUMS

      - name: Create release (gh CLI)
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          flags=(--verify-tag --generate-notes --title "$GITHUB_REF_NAME")
          # vX.Y.Z-rc1 etc. are marked as pre-releases.
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.tar.gz ./*.tar.gz.sha256 SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${flags[@]}" ./*.tar.gz ./*.tar.gz.sha256 SHA256SUMS
          fi
