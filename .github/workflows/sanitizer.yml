# ASan + UBSan (sanitizer preset). LeakSanitizer is enabled on Linux only.
# Design notes: docs/design/ci.md
name: sanitizer

run-name: ${{ inputs.ref != '' && format('{0} {1} os={2}', github.workflow, inputs.ref, inputs.os) || github.event.pull_request.title || github.event.head_commit.message || github.workflow }}

on:
  push:
    branches: [main]
    paths-ignore: &docs_only
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    paths-ignore: *docs_only
  schedule:
    - cron: "41 4 * * 1" # weekly, Monday 04:41 UTC
  workflow_dispatch:
    inputs:
      os:
        description: "all = ubuntu + macOS; ubuntu = Linux jobs only (used for wip/ task branches to spare the macOS runner quota)"
        type: choice
        options: [all, ubuntu]
        default: all
      ref:
        description: "commit to test instead of the dispatched ref (a wip/ branch SHA); lets main's workflow run on an older branch"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

env:
  CTEST_OUTPUT_ON_FAILURE: "1"
  LLVM_MAJOR: "22"
  UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"

jobs:
  sanitizer:
    name: asan+ubsan / ${{ matrix.os }} / ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # workflow_dispatch with os=ubuntu drops the macOS job (push events leave inputs empty).
        os: [ubuntu-26.04, macos-26]
        # fast = every non-slow labelled test + unlabelled safety net; slow-1/2/3 = the <category>-slow
        # tests (paper-size inputs, ~95% of the run time), dealt out by `ctest -I <n>,,3` so that the
        # three runners get a similar share. Every test runs in exactly one shard (docs/design/ci.md).
        shard: [fast, slow-1, slow-2, slow-3]
        exclude:
          - os: ${{ inputs.os == 'ubuntu' && 'macos-26' || 'none' }}
    env:
      # LeakSanitizer is part of ASan on Linux and is enabled explicitly there. Apple clang's ASan
      # does NOT support LeakSanitizer on macOS (detect_leaks=1 is rejected/ignored), so leaks are
      # only checked by the Linux job. (Selected by expression, not matrix.include, so that the
      # os=ubuntu exclude cannot be undone by an include entry.)
      ASAN_OPTIONS: ${{ format('detect_leaks={0}:strict_string_checks=1:detect_stack_use_after_return=1:check_initialization_order=1:strict_init_order=1', matrix.os == 'macos-26' && '0' || '1') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: Toolchain (Ubuntu, apt clang ${{ env.LLVM_MAJOR }})
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          pkgs=()
          command -v "clang++-${LLVM_MAJOR}" >/dev/null || pkgs+=("clang-${LLVM_MAJOR}")
          command -v ninja >/dev/null || pkgs+=(ninja-build)
          if [ "${#pkgs[@]}" -gt 0 ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${pkgs[@]}"
          fi
          echo "CXX=clang++-${LLVM_MAJOR}" >> "$GITHUB_ENV"
          # Large mmap ASLR entropy on recent kernels can break ASan's shadow mapping
          # ("AddressSanitizer:DEADLYSIGNAL" loops). Lowering it is harmless for CI.
          sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Toolchain (macOS, Apple clang)
        if: runner.os == 'macOS'
        run: command -v ninja >/dev/null || brew install ninja

      - name: Print tool versions
        run: |
          cmake --version | head -n1
          "${CXX:-c++}" --version
          echo "ASAN_OPTIONS=$ASAN_OPTIONS"
          echo "UBSAN_OPTIONS=$UBSAN_OPTIONS"

      - name: Restore FetchContent cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/fetchcontent/sanitizer
          key: fetchcontent-${{ runner.os }}-${{ runner.arch }}-sanitizer-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure (sanitizer preset)
        run: cmake --preset sanitizer -DFETCHCONTENT_BASE_DIR="$GITHUB_WORKSPACE/.cache/fetchcontent/sanitizer"

      - name: Build
        run: cmake --build --preset sanitizer

      # --no-tests=ignore: a shard that selects nothing is not a failure.
      - name: ctest non-slow labels
        if: ${{ matrix.shard == 'fast' }}
        run: ctest --preset sanitizer -L '^(unit|integration|differential|property|regression)$' --no-tests=ignore
      - name: ctest unlabelled (safety net)
        if: ${{ !cancelled() && matrix.shard == 'fast' }}
        run: ctest --preset sanitizer -LE '^(unit|integration|differential|property|regression)(-slow)?$' --no-tests=ignore
      # Tests tagged [slow] in Catch2 carry the label <category>-slow. `-I n,,3` = every third test
      # of that selection starting at the n-th; shards 1..3 together cover each slow test once.
      - name: ctest slow (paper-size inputs)
        if: ${{ startsWith(matrix.shard, 'slow-') }}
        run: ctest --preset sanitizer -L '^(unit|integration|differential|property|regression)-slow$' -I "${SHARD#slow-},,3" --no-tests=ignore
        env:
          SHARD: ${{ matrix.shard }}

      - name: Upload CTest logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sanitizer-logs-${{ matrix.os }}-${{ matrix.shard }}
          path: build/sanitizer/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 14
